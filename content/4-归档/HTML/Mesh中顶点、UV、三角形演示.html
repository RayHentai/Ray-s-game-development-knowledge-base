<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesh中顶点、UV、三角形演示</title>
  <style>
    :root {
      --color-background-primary:   #ffffff;
      --color-background-secondary: #f5f4f0;
      --color-background-info:      #e6f1fb;
      --color-text-primary:         #1a1916;
      --color-text-secondary:       #5f5e5a;
      --color-text-tertiary:        #888780;
      --color-text-info:            #0c447c;
      --color-text-warning:         #854f0b;
      --color-border-primary:       #c8c6bf;
      --color-border-secondary:     #d3d1c7;
      --color-border-tertiary:      #e0ded8;
      --color-border-info:          #378add;
      --border-radius-md:           6px;
      --border-radius-lg:           10px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    body {
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1rem 1.5rem;
    }
    .ts { font-size: 13px; }
    button {
      padding: 5px 12px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: var(--color-background-secondary); }
  </style>
</head>
<body>

<h2 class="sr-only">3D网格核心概念：顶点、三角形、UV，以6顶点4三角形为例</h2>
<div style="padding:1rem 0;">
<div style="display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;">
  <button id="btn0" onclick="show(0)" style="background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info);">顶点 vertices</button>
  <button id="btn1" onclick="show(1)">三角形 triangles</button>
  <button id="btn2" onclick="show(2)">UV 坐标</button>
</div>

<div id="panel0">
<svg width="100%" viewBox="0 0 680 340" role="img"><title>顶点示意图</title>
<text class="ts" x="160" y="28" text-anchor="middle" fill="var(--color-text-secondary)">6个顶点，构成两个矩形</text>
<circle cx="80" cy="80" r="7" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
<circle cx="240" cy="80" r="7" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
<circle cx="80" cy="190" r="7" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
<circle cx="240" cy="190" r="7" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
<circle cx="80" cy="300" r="7" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
<circle cx="240" cy="300" r="7" fill="#534AB7" stroke="#3C3489" stroke-width="1.5"/>
<line x1="80" y1="80" x2="240" y2="80" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="80" y1="190" x2="240" y2="190" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="80" y1="300" x2="240" y2="300" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="80" y1="80" x2="80" y2="300" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="240" y1="80" x2="240" y2="300" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="3 3"/>
<text class="ts" x="62" y="76" text-anchor="end" fill="#3C3489">V0 (0,2,0)</text>
<text class="ts" x="252" y="76" fill="#3C3489">V1 (1,2,0)</text>
<text class="ts" x="62" y="186" text-anchor="end" fill="#3C3489">V2 (0,1,0)</text>
<text class="ts" x="252" y="186" fill="#3C3489">V3 (1,1,0)</text>
<text class="ts" x="62" y="296" text-anchor="end" fill="#3C3489">V4 (0,0,0)</text>
<text class="ts" x="252" y="296" fill="#3C3489">V5 (1,0,0)</text>
<line x1="340" y1="20" x2="340" y2="330" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<rect x="360" y="50" width="290" height="240" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="376" y="76" fill="var(--color-text-tertiary)">Vector3[] vertices = new Vector3[]</text>
<text class="ts" x="376" y="98" fill="var(--color-text-tertiary)">{</text>
<text class="ts" x="392" y="120" fill="#534AB7">new Vector3(0, 2, 0), // V0</text>
<text class="ts" x="392" y="142" fill="#534AB7">new Vector3(1, 2, 0), // V1</text>
<text class="ts" x="392" y="164" fill="#534AB7">new Vector3(0, 1, 0), // V2</text>
<text class="ts" x="392" y="186" fill="#534AB7">new Vector3(1, 1, 0), // V3</text>
<text class="ts" x="392" y="208" fill="#534AB7">new Vector3(0, 0, 0), // V4</text>
<text class="ts" x="392" y="230" fill="#534AB7">new Vector3(1, 0, 0), // V5</text>
<text class="ts" x="376" y="252" fill="var(--color-text-tertiary)">};</text>
</svg>
</div>

<div id="panel1" style="display:none;">
<svg width="100%" viewBox="0 0 680 360" role="img"><title>三角形索引示意图</title>
<text class="ts" x="160" y="28" text-anchor="middle" fill="var(--color-text-secondary)">4个三角形，顺时针绕序</text>
<polygon points="80,80 240,80 80,190" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5" opacity="0.8"/>
<polygon points="240,80 240,190 80,190" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5" opacity="0.8"/>
<polygon points="80,190 240,190 80,300" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5" opacity="0.8"/>
<polygon points="240,190 240,300 80,300" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5" opacity="0.8"/>
<circle cx="80" cy="80" r="6" fill="#534AB7"/>
<circle cx="240" cy="80" r="6" fill="#534AB7"/>
<circle cx="80" cy="190" r="6" fill="#534AB7"/>
<circle cx="240" cy="190" r="6" fill="#534AB7"/>
<circle cx="80" cy="300" r="6" fill="#534AB7"/>
<circle cx="240" cy="300" r="6" fill="#534AB7"/>
<text class="ts" x="62" y="76" text-anchor="end" fill="#3C3489">V0</text>
<text class="ts" x="252" y="76" fill="#3C3489">V1</text>
<text class="ts" x="62" y="186" text-anchor="end" fill="#3C3489">V2</text>
<text class="ts" x="252" y="186" fill="#3C3489">V3</text>
<text class="ts" x="62" y="296" text-anchor="end" fill="#3C3489">V4</text>
<text class="ts" x="252" y="296" fill="#3C3489">V5</text>
<text class="ts" x="120" y="148" fill="#3C3489">①</text>
<text class="ts" x="185" y="162" fill="#085041">②</text>
<text class="ts" x="120" y="258" fill="#633806">③</text>
<text class="ts" x="185" y="272" fill="#993C1D">④</text>
<line x1="310" y1="20" x2="310" y2="350" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<rect x="326" y="40" width="330" height="290" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="342" y="66" fill="var(--color-text-tertiary)">int[] triangles = new int[]</text>
<text class="ts" x="342" y="88" fill="var(--color-text-tertiary)">{</text>
<text class="ts" x="358" y="110" fill="#3C3489">0, 1, 2,  // ① V0→V1→V2</text>
<text class="ts" x="358" y="132" fill="#085041">1, 3, 2,  // ② V1→V3→V2</text>
<text class="ts" x="358" y="154" fill="#633806">2, 3, 4,  // ③ V2→V3→V4</text>
<text class="ts" x="358" y="176" fill="#993C1D">3, 5, 4,  // ④ V3→V5→V4</text>
<text class="ts" x="342" y="198" fill="var(--color-text-tertiary)">};</text>
<text class="ts" x="342" y="230" fill="var(--color-text-secondary)">每3个索引 = 1个三角形</text>
<text class="ts" x="342" y="252" fill="var(--color-text-secondary)">顶点可被多个三角形复用</text>
<text class="ts" x="342" y="286" fill="var(--color-text-warning)">顺时针绕序 = 正面朝外</text>
<text class="ts" x="342" y="308" fill="var(--color-text-warning)">所有三角形保持一致</text>
</svg>
</div>

<div id="panel2" style="display:none;">
<svg width="100%" viewBox="0 0 680 360" role="img"><title>UV坐标示意图</title>
<text class="ts" x="160" y="28" text-anchor="middle" fill="var(--color-text-secondary)">UV随顶点延伸，V轴从0到2</text>
<rect x="60" y="50" width="200" height="280" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-secondary)" stroke-width="1"/>
<line x1="60" y1="190" x2="260" y2="190" stroke="var(--color-border-tertiary)" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="ts" x="40" y="54" text-anchor="end" fill="var(--color-text-tertiary)">(0,2)</text>
<text class="ts" x="264" y="54" fill="var(--color-text-tertiary)">(1,2)</text>
<text class="ts" x="40" y="194" text-anchor="end" fill="var(--color-text-tertiary)">(0,1)</text>
<text class="ts" x="264" y="194" fill="var(--color-text-tertiary)">(1,1)</text>
<text class="ts" x="40" y="334" text-anchor="end" fill="var(--color-text-tertiary)">(0,0)</text>
<text class="ts" x="264" y="334" fill="var(--color-text-tertiary)">(1,0)</text>
<circle cx="60" cy="50" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="260" cy="50" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="60" cy="190" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="260" cy="190" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="60" cy="330" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="260" cy="330" r="6" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts" x="145" y="128" text-anchor="middle" fill="var(--color-text-secondary)">贴图第2遍</text>
<text class="ts" x="145" y="270" text-anchor="middle" fill="var(--color-text-secondary)">贴图第1遍</text>
<line x1="310" y1="20" x2="310" y2="350" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<rect x="326" y="40" width="330" height="290" rx="8" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>
<text class="ts" x="342" y="66" fill="var(--color-text-tertiary)">Vector2[] uvs = new Vector2[]</text>
<text class="ts" x="342" y="88" fill="var(--color-text-tertiary)">{</text>
<text class="ts" x="358" y="110" fill="#993C1D">new Vector2(0, 2), // V0</text>
<text class="ts" x="358" y="132" fill="#993C1D">new Vector2(1, 2), // V1</text>
<text class="ts" x="358" y="154" fill="#993C1D">new Vector2(0, 1), // V2</text>
<text class="ts" x="358" y="176" fill="#993C1D">new Vector2(1, 1), // V3</text>
<text class="ts" x="358" y="198" fill="#993C1D">new Vector2(0, 0), // V4</text>
<text class="ts" x="358" y="220" fill="#993C1D">new Vector2(1, 0), // V5</text>
<text class="ts" x="342" y="242" fill="var(--color-text-tertiary)">};</text>
<text class="ts" x="342" y="274" fill="var(--color-text-secondary)">UV与vertices索引一一对应</text>
<text class="ts" x="342" y="296" fill="var(--color-text-secondary)">超出0~1范围贴图会重复</text>
<text class="ts" x="342" y="318" fill="var(--color-text-secondary)">（需要Wrap Mode = Repeat）</text>
</svg>
</div>
</div>

<script>
function show(i){
  [0,1,2].forEach(j=>{
    document.getElementById('panel'+j).style.display=j===i?'block':'none';
    const b=document.getElementById('btn'+j);
    if(j===i){b.style.background='var(--color-background-info)';b.style.color='var(--color-text-info)';b.style.borderColor='var(--color-border-info)';}
    else{b.style.background='';b.style.color='';b.style.borderColor='';}
  });
}
</script>

</body>
</html>
