<style>
:root {

  --border-hover: rgba(0,0,0,0.22);
  --text-primary: #1a1918;
  --text-secondary: #5a5856;
  --text-muted: #8a8784;
  --divider: rgba(0,0,0,0.07);

  --purple-light: #4a3db8;
  --purple: #6255d8;
  --purple-dim: rgba(98,85,216,0.1);

  --teal-light: #0a6e50;
  --teal: #0f8060;
  --teal-dim: rgba(15,128,96,0.1);

  --coral-light: #8e3018;
  --coral: #c84c28;
  --coral-dim: rgba(200,76,40,0.1);

  --amber-light: #7a4a00;
  --amber: #a06000;
  --amber-dim: rgba(160,96,0,0.1);

  --blue-light: #0c3e80;
  --blue: #185fb8;
  --blue-dim: rgba(24,95,184,0.1);

  --pink-light: #6e1840;
  --pink: #a03068;
  --pink-dim: rgba(160,48,104,0.1);

  /* 新增：给原来灰色节点的颜色 */
  --olive-light: #3d4a10;
  --olive: #5a6e18;
  --olive-dim: rgba(90,110,24,0.1);

  --brown-light: #5a3010;
  --brown: #7a4820;
  --brown-dim: rgba(122,72,32,0.1);

  --slate-light: #1a3050;
  --slate: #2a4870;
  --slate-dim: rgba(42,72,112,0.1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  padding: 40px 20px 80px;
}

.page-header {
  max-width: 1080px;
  margin: 0 auto 40px;
}
.page-header h1 {
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.01em;
  margin-bottom: 10px;
}
.page-header p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.75;
}

.chart-wrap {
  max-width: 1080px;
  margin: 0 auto;
  overflow-x: auto;
}

svg { display: block; width: 100%; min-width: 720px; }

.node-group { cursor: pointer; }
.node-group:hover .nr { filter: brightness(0.92); }

.era-label {
  font-size: 10.5px;
  fill: var(--text-muted);
  font-family: 'SF Mono', 'Fira Code', monospace;
}

.tooltip {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border-hover);
  border-radius: 10px;
  padding: 14px 18px;
  font-size: 13px;
  line-height: 1.65;
  max-width: 290px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.16s;
  z-index: 999;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.tooltip.vis { opacity: 1; }
.tooltip h3 { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
.tooltip .et { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-family: monospace; }
.tooltip p { color: var(--text-secondary); font-size: 12.5px; }
.tooltip .ar { margin-top: 8px; font-size: 11.5px; color: var(--text-muted); font-style: italic; }

.legend {
  max-width: 1080px;
  margin: 32px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  padding: 18px 22px;
  background: var(--bg2);
  border-radius: 12px;
  border: 1px solid var(--border);
}
.li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.ll { width: 30px; height: 2px; border-radius: 1px; flex-shrink: 0; }
.ll.d { background: none !important; border-top: 2px dashed; height: 0; border-radius: 0; }
</style>
</head>

<script>
const D = {
  africa: { n:"非洲音乐传统", e:"远古 — 19世纪", d:"以复杂多声部节奏与呼唤-回应（Call & Response）结构为核心。经由跨大西洋奴隶贸易传入美洲，成为所有黑人音乐的基因底层。", a:"" },
  blues: { n:"Blues 蓝调", e:"19世纪末 · 密西西比三角洲", d:"源自田间劳动歌曲与非裔灵歌，以12小节进行、蓝调音阶和喊唱哭腔为核心。是此后所有流派最直接的共同祖先。", a:"Robert Johnson · Bessie Smith · Muddy Waters · B.B. King" },
  gospel: { n:"Gospel & 劳动歌曲", e:"19世纪 · 黑人教会", d:"非裔美国人教会中的圣歌传统，将非洲节奏与基督教情感融合。是Soul最直接的精神源头。", a:"Mahalia Jackson · Sister Rosetta Tharpe" },
  jazz: { n:"Jazz 爵士乐", e:"1900s–1930s · 新奥尔良→纽约", d:"融合Blues、Ragtime与欧洲和声，以高度即兴、丰富色彩化和声为特征。二战后分化为Bebop、Cool Jazz、Modal、Free Jazz等流派。", a:"Louis Armstrong · Miles Davis · John Coltrane · Bill Evans · Charlie Parker" },
  rnb: { n:"R&B 节奏蓝调", e:"1940s–1950s · 北方城市", d:"Blues电气化+节拍强化后的城市版本。二战后随非裔美国人北迁而生，是唱片公司将'Race Music'重新命名的产物。", a:"Ray Charles · Ruth Brown · Bo Diddley · Fats Domino" },
  ragtime: { n:"Ragtime 散拍", e:"1890s–1910s", d:"欧洲古典和声与非洲切分节奏的结合产物，是Jazz的重要前身之一，提供了复杂的和弦行进逻辑。", a:"Scott Joplin" },
  soul: { n:"Soul 灵魂乐", e:"1950s末–1970s · Memphis & Motown", d:"R&B与Gospel深度融合，与民权运动紧密相连。孟菲斯（Stax）和底特律（Motown）是两大中心，情感表达强烈，声乐技巧要求极高。", a:"Aretha Franklin · Otis Redding · Sam Cooke · Marvin Gaye · Stevie Wonder" },
  funk: { n:"Funk 放克", e:"1960s末–1970s", d:"从Soul内部裂变，James Brown将节拍极度强化（The One拍）、和声简化为持续七和弦、每件乐器作为节奏单元运作。Slap Bass与Wah吉他成为标志音色。", a:"James Brown · Parliament-Funkadelic · Sly & The Family Stone · Ohio Players" },
  jazzmodal: { n:"Modal / Free Jazz", e:"1950s末–1970s", d:"Modal Jazz（Miles Davis《Kind of Blue》）抛弃快速和弦进行转向调式即兴；Free Jazz（Ornette Coleman）进一步解除调性与节奏约束。", a:"Miles Davis · John Coltrane · Ornette Coleman · Cecil Taylor" },
  hiphop: { n:"Hip-Hop", e:"1970s末 · 南布朗克斯", d:"诞生于纽约南布朗克斯贫困社区，以采样（Sampling）Funk/Soul唱片为核心技术，配合MC说唱、DJ打碟、涂鸦与霹雳舞四大要素。", a:"DJ Kool Herc · Grandmaster Flash · Run-DMC · Public Enemy · Nas · Jay-Z" },
  disco: { n:"Disco", e:"1970s · 纽约夜店", d:"从Funk和Soul提炼出最适合舞池的元素，加入弦乐编曲和稳定四四拍踩镲。与LGBTQ+文化深度绑定，催生了House和Techno，并通过Disco八拍律动间接影响City Pop编曲。", a:"Donna Summer · Chic · Giorgio Moroder · Gloria Gaynor" },
  aor: { n:"AOR / Soft Rock", e:"1970s–1980s", d:"成人向取向摇滚，精良的录音室制作、柔和旋律感与适度爵士和声。Steely Dan的多轨录音美学和Boz Scaggs的都市情调对City Pop编曲影响极大。", a:"Steely Dan · Boz Scaggs · Michael McDonald · Christopher Cross" },
  jazzfusion: { n:"Jazz Fusion", e:"1970s", d:"Jazz与Rock、Funk的混合，大量使用电子乐器和强劲节拍。CTI唱片公司的光滑质感尤其影响了日本City Pop制作人对电钢琴音色的品味。", a:"Weather Report · Return to Forever · Herbie Hancock · Bob James" },
  jazzhiphop: { n:"Jazz Hip-Hop", e:"1990s初 · 纽约", d:"将爵士唱片采样与Hip-Hop节拍结合，创造更复杂的和声背景。A Tribe Called Quest用爵士采样重新定义了说唱音乐的质感，直接影响Nujabes。", a:"A Tribe Called Quest · Gang Starr · Pete Rock & CL Smooth · De La Soul · Digable Planets" },
  citypop: { n:"City Pop 城市流行", e:"1978–1989 · 日本东京", d:"日本泡沫经济时代的产物，将R&B律动、Funk质感、Jazz和声与AOR精良制作融合，描绘都市中产休闲生活。2019年后在YouTube算法推动下在全球掀起复兴热潮。", a:"山下達郎 · 竹内まりや · 大滝詠一 · 松原みき · 杏里 · 亜蘭知子" },
  neosoul: { n:"Neo-Soul", e:"1990s中 · 美国", d:"1990s对Soul传统的复兴与更新，融入Hip-Hop节拍、Jazz和声与现代R&B制作美学。对2000s日本J-Soul浪潮影响深远。", a:"Erykah Badu · D'Angelo · Lauryn Hill · Maxwell · Jill Scott" },
  smoothjazz: { n:"Smooth Jazz", e:"1980s–1990s", d:"Jazz的商业化流行分支，保留流畅旋律与轻柔节奏，去除即兴挑战性。在日本形成了独特的'BGM爵士'文化土壤。", a:"George Benson · Kenny G · Bob James · Spyro Gyra" },
  nujabes: { n:"Nujabes / 日本 Lo-fi", e:"1990s末–2000s · 东京", d:"DJ兼制作人Nujabes将Jazz Hip-Hop美学彻底日本化，以细腻的爵士采样创造出冥想性质的节拍音乐。2010年逝世后，其遗产直接催生了全球Lo-fi Hip-Hop Beats文化。", a:"Nujabes · DJ Okawari · 保刈久明（Samurai Champloo OST）· Fat Jon" },
  shibuya: { n:"涩谷系 Shibuya-kei", e:"1990s初–2000s · 东京涩谷", d:"发源于涩谷唱片店文化圈的后现代拼贴风格，以博学的'唱片挖掘'精神引用法国香颂、Bossa Nova、Exotica等大量西方冷门素材。", a:"Pizzicato Five · Cornelius · Kahimi Karie · Flipper's Guitar · Original Love" },
  jrnb: { n:"J-Soul / J-R&B", e:"1998–2000s · 日本", d:"美国Neo-Soul与R&B在1990s末传入日本后，与J-Pop制作工业结合的产物。宇多田ヒカル1998年出道彻底改写了J-Pop格局。", a:"宇多田ヒカル · MISIA · 倉木麻衣 · AI · Superfly · Juju" },
  bossanova: { n:"Bossa Nova & 世界音乐", e:"1950s–1960s · 巴西/法国", d:"巴西的温柔节奏与法国香颂的精致氛围是涩谷系最重要的非美洲养分。João Gilberto的轻抚和弦方式与Gainsbourg的极简冷淡感被涩谷系奉为圭臬。", a:"João Gilberto · Astrud Gilberto · Serge Gainsbourg · Caetano Veloso" },
  jhiphop: { n:"日本 Hip-Hop", e:"2000s–今 · 日本", d:"从模仿美国到建立本土美学，日本Hip-Hop逐渐发展出独特风格。2010s后'封闭花园'世代（KOHH、舐達麻）以街头真实性取代偶像包装。", a:"KOHH · 舐達麻 · KID FRESINO · BIM · Salu · 般若 · ZORN" },
  jazzpopjp: { n:"日本爵士 / 前卫流行", e:"1970s–1980s", d:"City Pop与涩谷系孕育出的日本独有爵士语境。坂本龍一代表了将电子音乐与爵士和声结合的前卫路线，Yellow Magic Orchestra则开创了合成器流行的日本范式。", a:"坂本龍一 · 大貫妙子 · Yellow Magic Orchestra · 高中正義 · 渡辺貞夫" },
  technopop: { n:"テクノポップ / 日本電音", e:"2000s–今 · 日本", d:"涩谷系的后现代精神延伸到电子舞曲领域。中田ヤスタカ为代表，将精密合成器编程与J-Pop旋律结合，Perfume和capsule创造了独一无二的'人声机械化'美学。", a:"Perfume · capsule · きゃりーぱみゅぱみゅ · 電気グルーヴ" },
  jazzjpclub: { n:"日本爵士现场文化", e:"1970s–今", d:"日本是美国以外最重要的爵士乐消费市场，拥有密度极高的爵士现场文化。Blue Note Tokyo等演出场所维系了爵士在大众文化中的持续存在。", a:"" },
  lofi: { n:"Lo-fi / Chill Beats", e:"2010s–今 · 全球", d:"以Nujabes精神为核心，借助YouTube'Lo-fi Hip-Hop Radio'格式全球扩散，形成供学习/工作背景聆听的全球亚文化。日本动漫美学成为这一文化的视觉标志。", a:"ChilledCow · college music · j'san · Idealism" },
  citypoprevival: { n:"City Pop 复兴", e:"2019–今", d:"YouTube算法将竹内まりや《Plastic Love》等1980s作品推送给全球听众，引发跨越语言的City Pop热潮。新生代艺人将这种美学更新为当代J-Pop。", a:"藤井風 · Vaundy · iri · Maya Hatch · Tofubeats · 折坂悠太" },
  hyperpopjp: { n:"日本新世代 / Hyperpop", e:"2010s–今", d:"从テクノポップ与涩谷系DNA出发，融合西方Hyperpop的声音极端性和互联网文化。YOASOBI以'小说→音乐'的转化概念打破传统J-Pop创作模式。", a:"YOASOBI · ずっと真夜中でいいのに · ATARASHII GAKKO! · Ado · 米津玄師" },
  jazzjpmodern: { n:"当代日本爵士", e:"2000s–今", d:"在国际爵士语境中发展出鲜明个人风格的日本演奏家。上原ひろみ以超技术演奏和跨界融合享誉全球，代表了日本爵士在继承传统基础上的独立创新能力。", a:"上原ひろみ · 小曽根真 · 渡辺貞夫 · 日野皓正 · 菊地成孔" },
  global: { n:"全球流媒体时代", e:"2015–今", d:"Spotify、YouTube、TikTok的算法推荐彻底打破音乐的地域和时代边界。City Pop、Lo-fi、J-Soul在全球青少年中同步传播，日本音乐第一次真正意义上成为全球流行的有机组成部分。", a:"" }
};

const tt = document.getElementById('tt');
let ht;
document.querySelectorAll('.node-group').forEach(g => {
  g.addEventListener('mouseenter', e => {
    const inf = D[g.dataset.id]; if (!inf) return;
    clearTimeout(ht);
    tt.innerHTML = `<h3>${inf.n}</h3><div class="et">${inf.e}</div><p>${inf.d}</p>${inf.a ? `<div class="ar">${inf.a}</div>` : ''}`;
    tt.classList.add('vis');
    pos(e);
  });
  g.addEventListener('mousemove', pos);
  g.addEventListener('mouseleave', () => { ht = setTimeout(() => tt.classList.remove('vis'), 140); });
});
function pos(e) {
  const w=296, h=170, x0=e.clientX+16, y0=e.clientY+16;
  tt.style.left = (x0+w>window.innerWidth-8 ? e.clientX-w-16 : x0)+'px';
  tt.style.top = (y0+h>window.innerHeight-8 ? e.clientY-h-16 : y0)+'px';
}
</script>
