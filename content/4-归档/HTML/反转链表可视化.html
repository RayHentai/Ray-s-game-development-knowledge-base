<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反转链表双指针演示</title>
</head>
<body>

<h2 class="sr-only">反转链表双指针演示</h2>
<div style="padding:1.5rem 0;">

<div style="display:flex; gap:12px; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center;">
  <button id="prevBtn" onclick="step(-1)" style="min-width:80px;" disabled>上一步</button>
  <button id="nextBtn" onclick="step(1)" style="min-width:80px;">下一步 →</button>
  <button onclick="reset()" style="min-width:80px;">重置</button>
  <span id="stepLabel" style="font-size:13px; color:var(--color-text-secondary);">步骤 0 / 6</span>
</div>

<div id="canvas" style="overflow-x:auto; margin-bottom:1rem;"></div>

<div style="margin-top:1rem;">
  <button onclick="toggleSection('codeSection', 'codeToggle')" style="font-size:13px; width:100%; text-align:left; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
    <span>查看当前代码</span>
    <span id="codeToggle" style="font-size:11px; color:var(--color-text-secondary);">展开 ▼</span>
  </button>
  <div id="codeSection" style="display:none; background:var(--color-background-secondary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:1rem; font-family:var(--font-mono); font-size:13px; line-height:1.8; margin-top:4px;"></div>
</div>

<div style="margin-top:8px;">
  <button onclick="toggleSection('explainSection', 'explainToggle')" style="font-size:13px; width:100%; text-align:left; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
    <span>查看步骤说明</span>
    <span id="explainToggle" style="font-size:11px; color:var(--color-text-secondary);">展开 ▼</span>
  </button>
  <div id="explainSection" style="display:none; background:var(--color-background-secondary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); padding:1rem; font-size:14px; color:var(--color-text-secondary); margin-top:4px;"></div>
</div>

</div>

<script>
const states = [
  { pre:null, cur:0, reversed:[], links:[[0,1],[1,2],[2,3],[3,4]], highlight:null, explain:"初始状态：pre = null，cur 指向节点 1（头节点），链表从左到右正向连接。" },
  { pre:null, cur:0, reversed:[], links:[[0,1],[1,2],[2,3],[3,4]], highlight:"temp", explain:"temp = cur.next，保存节点 2，防止反转后链表断裂找不到后续节点。" },
  { pre:null, cur:0, reversed:[], links:[[1,2],[2,3],[3,4]], highlight:"reverse", explain:"cur.next = pre（null），节点 1 的指针反转，现在指向 null。" },
  { pre:0, cur:1, reversed:[0], links:[[1,2],[2,3],[3,4]], highlight:null, explain:"pre = cur（节点1），cur = temp（节点2），两个指针各自前移一步。" },
  { pre:1, cur:2, reversed:[0,1], links:[[2,3],[3,4]], highlight:null, explain:"同样操作：保存 temp=节点3，反转节点2指向节点1，pre和cur各自前移。" },
  { pre:2, cur:3, reversed:[0,1,2], links:[[3,4]], highlight:null, explain:"节点3反转，指向节点2。pre移到节点3，cur移到节点4。" },
  { pre:3, cur:4, reversed:[0,1,2,3], links:[], highlight:null, explain:"节点4反转，指向节点3。cur.next = null，循环结束。返回 pre，即新的头节点（节点5在此处由节点4指向null表示末尾）。" },
];

const codeLines = [
  { text:"ListNode temp = cur.next;", key:"temp" },
  { text:"cur.next = pre;",           key:"reverse" },
  { text:"pre = cur;",                key:null },
  { text:"cur = temp;",               key:null },
];

const vals = [1,2,3,4,5];
let current = 0;

function toggleSection(sectionId, toggleId) {
  const sec = document.getElementById(sectionId);
  const tog = document.getElementById(toggleId);
  if (!sec || !tog) return;
  if (sec.style.display === 'none') {
    sec.style.display = 'block';
    tog.textContent = '收起 ▲';
  } else {
    sec.style.display = 'none';
    tog.textContent = '展开 ▼';
  }
}

function render() {
  const s = states[current];
  const NW=52, NH=36, GAP=58, SX=24, Y=65;
  const W = SX + vals.length*(NW+GAP)+60;

  let svg = `<svg viewBox="0 0 ${W} 155" style="width:100%;max-width:${W}px;" role="img"><title>链表反转状态</title>`;
  svg += `<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#888780"/></marker>`;
  svg += `<marker id="ra" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#185FA5"/></marker></defs>`;

  const cx = i => SX + i*(NW+GAP) + NW/2;
  const cy = Y + NH/2;

  vals.forEach((v,i) => {
    const x = SX + i*(NW+GAP);
    let fill='#E1F5EE', stroke='#0F6E56', tc='#085041';
    if (s.cur===i)       { fill='#EEEDFE'; stroke='#534AB7'; tc='#3C3489'; }
    else if (s.pre===i)  { fill='#FAEEDA'; stroke='#854F0B'; tc='#633806'; }
    else if (s.reversed.includes(i)) { fill='#E6F1FB'; stroke='#185FA5'; tc='#0C447C'; }
    svg += `<rect x="${x}" y="${Y}" width="${NW}" height="${NH}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    svg += `<text x="${cx(i)}" y="${cy+5}" text-anchor="middle" font-size="15" font-weight="500" fill="${tc}">${v}</text>`;
  });

  s.links.forEach(([f,t]) => {
    const x1=SX+f*(NW+GAP)+NW, x2=SX+t*(NW+GAP);
    svg += `<line x1="${x1+2}" y1="${cy}" x2="${x2-8}" y2="${cy}" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>`;
  });

  s.reversed.forEach(i => {
    if (i>0) {
      const x1=SX+i*(NW+GAP), x2=SX+(i-1)*(NW+GAP)+NW;
      svg += `<path d="M${x1+4},${cy-10} C${x1-10},${cy-32} ${x2+10},${cy-32} ${x2-2},${cy-10}" stroke="#185FA5" stroke-width="1.5" fill="none" marker-end="url(#ra)"/>`;
    }
  });

  if (s.reversed.includes(0)) {
    const x=SX;
    svg += `<line x1="${x-4}" y1="${cy}" x2="${x-28}" y2="${cy}" stroke="#185FA5" stroke-width="1.5" marker-end="url(#ra)"/>`;
    svg += `<text x="${x-34}" y="${cy+4}" text-anchor="middle" font-size="10" fill="#185FA5">null</text>`;
  }

  vals.forEach((_,i) => {
    const x=cx(i);
    if (s.cur===i) {
      svg += `<text x="${x}" y="${Y+NH+16}" text-anchor="middle" font-size="11" font-weight="500" fill="#534AB7">cur</text>`;
      svg += `<line x1="${x}" y1="${Y+NH+2}" x2="${x}" y2="${Y+NH+7}" stroke="#534AB7" stroke-width="1.2"/>`;
    }
    if (s.pre===i) {
      svg += `<text x="${x}" y="${Y-14}" text-anchor="middle" font-size="11" font-weight="500" fill="#854F0B">pre</text>`;
      svg += `<line x1="${x}" y1="${Y-8}" x2="${x}" y2="${Y-2}" stroke="#854F0B" stroke-width="1.2"/>`;
    }
  });

  if (s.pre===null) {
    svg += `<text x="12" y="${Y-14}" font-size="11" font-weight="500" fill="#854F0B">pre=null</text>`;
  }

  svg += `</svg>`;
  document.getElementById('canvas').innerHTML = svg;

  const codeEl = document.getElementById('codeSection');
  if (codeEl) {
    codeEl.innerHTML = codeLines.map(l => {
      const active = s.highlight && s.highlight === l.key;
      return `<div style="padding:1px 0;${active?'background:var(--color-background-warning);border-radius:3px;padding:1px 6px;color:var(--color-text-warning);':'color:var(--color-text-secondary);'}">${l.text}</div>`;
    }).join('');
  }

  const expEl = document.getElementById('explainSection');
  if (expEl) expEl.textContent = s.explain;

  document.getElementById('stepLabel').textContent = `步骤 ${current} / ${states.length-1}`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===states.length-1;
}

function step(dir) {
  current = Math.max(0, Math.min(states.length-1, current+dir));
  render();
}

function reset() { current=0; render(); }

render();
</script>

</body>
</html>
